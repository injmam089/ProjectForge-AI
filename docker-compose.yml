services:
  postgres:
    image: postgres:16-alpine
    container_name: projectforge-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectforge}
      POSTGRES_USER: ${POSTGRES_USER:-projectforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectforge_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectforge_user} -d ${POSTGRES_DB:-projectforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: projectforge_postgres_data
